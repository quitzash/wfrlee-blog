# nginx site for the blog on the VM.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/wfrlee-blog
#   sudo ln -s /etc/nginx/sites-available/wfrlee-blog /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d blog.wfrlee.com      # adds the HTTPS (443) block
#
# Replace blog.wfrlee.com below if you use a different subdomain (and update
# `site` in astro.config.mjs and SITE_URL in src/consts.ts to match).

# Security headers. Pages rendered by the Node server already carry them
# (src/middleware.ts, stricter ones for /admin), but prerendered HTML and
# static files bypass the middleware. Each header is added only when the app
# did not send it: nginx skips `add_header` when the value is empty.
map $upstream_http_x_content_type_options $wb_xcto { "" "nosniff"; default ""; }
map $upstream_http_x_frame_options $wb_xfo { "" "SAMEORIGIN"; default ""; }
map $upstream_http_referrer_policy $wb_referrer { "" "strict-origin-when-cross-origin"; default ""; }
map $upstream_http_permissions_policy $wb_permissions { "" "geolocation=(), microphone=(), camera=()"; default ""; }
map $upstream_http_cross_origin_opener_policy $wb_coop { "" "same-origin"; default ""; }
map $upstream_http_content_security_policy $wb_csp {
	"" "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'";
	default "";
}
map $upstream_http_strict_transport_security $wb_hsts { "" "max-age=31536000; includeSubDomains"; default ""; }

server {
	listen 80;
	listen [::]:80;
	server_name blog.wfrlee.com;

	client_max_body_size 2m;

	add_header X-Content-Type-Options $wb_xcto always;
	add_header X-Frame-Options $wb_xfo always;
	add_header Referrer-Policy $wb_referrer always;
	add_header Permissions-Policy $wb_permissions always;
	add_header Cross-Origin-Opener-Policy $wb_coop always;
	add_header Content-Security-Policy $wb_csp always;
	add_header Strict-Transport-Security $wb_hsts always;

	location / {
		proxy_pass http://127.0.0.1:4321;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;
		# Overwrite (not append) so a client cannot spoof the IP used for
		# rate limiting in src/lib/auth.ts → clientIp.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;

		# AI post generation can run for several minutes.
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
	}
}
